apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: dev
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    name: redis-cache
    system: url-shortening-system
    app: redis
    type: cache
  ports:
    - name: redis-exporter
      port: 9121
      targetPort: 9121
      protocol: TCP