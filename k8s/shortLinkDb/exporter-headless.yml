apiVersion: v1
kind: Service
metadata:
  name: short-link-database-exporter
  namespace: dev
spec:
  clusterIP: None
  selector:
    name: postgres
    system: url-shortening-system
    app: short-link-database
    type: database
    role: master
  ports:
    - name: short-link-database-exporter
      port: 9187
      targetPort: 9187