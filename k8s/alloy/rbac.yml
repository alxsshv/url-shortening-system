apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-account
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-role
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-role-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: alloy-account
    namespace: dev
roleRef:
  kind: Role
  name: alloy-role
  apiGroup: rbac.authorization.k8s.io