apiVersion: v1
kind: Service
metadata:
  name: alloy-otlp
  namespace: dev
spec:
  type: ClusterIP
  selector:
    name: alloy
    system: url-shortening-system
    type: monitoring
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318