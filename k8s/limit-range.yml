apiVersion: v1
kind: LimitRange
metadata:
  name: range-defaults
  namespace: dev
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
        cpu: 250m
        ephemeral-storage: 1Gi
      defaultRequest:
        memory: 128Mi
        cpu: 200m
        ephemeral-storage: 500Mi
      max:
        memory: 4Gi
        cpu: 2
        ephemeral-storage: 10Gi
      min:
        memory: 128Mi
        cpu: 100m
        ephemeral-storage: 100Mi